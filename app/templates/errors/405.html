<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>405 – Method Not Allowed – Sarkin Mota Autos</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:#0a192f;
      color:#f7fafc;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:2rem;
    }
    .error-code{
      font-size:8rem;
      font-weight:800;
      color:#e53e3e;
      letter-spacing:-0.04em;
      line-height:1;
    }
    h1{font-size:2rem;font-weight:700;margin-top:1rem}
    p{color:#a0aec0;max-width:460px;margin:.75rem auto 0;line-height:1.7}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      margin-top:2rem;
      padding:.75rem 2rem;
      background:#e53e3e;color:#fff;border:none;
      border-radius:10px;font-weight:600;font-size:1rem;
      text-decoration:none;cursor:pointer;
      transition:background .2s,transform .15s;
    }
    .btn:hover{background:#c53030;transform:translateY(-2px)}
    .icon{font-size:3rem;margin-bottom:1.5rem}
    .skip-link{position:absolute;top:-40px;left:0;background:#e53e3e;color:white;padding:8px 16px;z-index:100;text-decoration:none;font-weight:600;transition:top .3s}
    .skip-link:focus{top:0}
    footer{
      position:absolute;bottom:0;left:0;right:0;
      padding:1rem;
      text-align:center;
      font-size:.8rem;color:#4a5568;
    }
  </style>
    {% include '_pwa_head.html' %}
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="icon">🚫</div>
  <div class="error-code">405</div>
  <h1>Method Not Allowed</h1>
  <p>The HTTP method you used is not allowed for this resource. Please check the documentation or return to the previous page.</p>
  <div>
    <a href="/" class="btn">Go Home</a>
    <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
  </div>
  <footer>&copy; 2019–2026 Sarkin Mota Autos. All rights reserved.</footer>
</body>
</html>
