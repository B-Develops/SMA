# Separate paid Render stack. Create a new Blueprint using this file so the
# existing free service and database remain untouched until cutover.

databases:
  - name: sarkinmota-production-db
    databaseName: sarkinmota
    user: sarkinmota
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: frankfurt

services:
  - type: web
    name: sarkinmota-production
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true

    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sarkinmota-production-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: FLASK_ENV
        value: production

      # Set this to the exact URL Render assigns to the new service.
      - key: BASE_URL
        sync: false

      - key: UPLOAD_DIR
        value: /var/data/uploads

      - key: FORCE_HTTPS
        value: "True"
      - key: HSTS
        value: "True"

      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # The new database is empty, so these create the first administrator.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
